[project]
name = "update-fork-repositories"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Test User", email = "yvesmarinho@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
update-fork-repositories = "update_fork_repositories.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/update_fork_repositories"]
